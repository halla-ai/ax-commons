name: Aggregate privacy checks
on:
  push:
    branches: [main, 'feat/5-aggregates']
  pull_request:
concurrency:
  group: ax-commons-verification
  cancel-in-progress: false
jobs:
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Receiver and dashboard tests
        run: node --test --test-concurrency=2 packages/receiver/test/*.test.mjs packages/dashboard/test/*.test.mjs
      - name: Deployment syntax
        run: node --check packages/receiver/src/vercel.mjs && node --check packages/receiver/src/github-store.mjs
