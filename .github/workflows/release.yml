name: Release and deploy
on:
  workflow_run:
    workflows: [Full release checks]
    types: [completed]
permissions:
  contents: write
  actions: read
concurrency:
  group: ax-commons-release
  cancel-in-progress: false
jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Verify current trusted main before accessing source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          test "$current" = "$SOURCE_SHA"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Download verified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --dir verified
      - name: Configure STAIx deployment authentication
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_DEPLOY_TOKEN }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const auth = process.env.RUNNER_TEMP + '/vercel';
          fs.mkdirSync(auth, {recursive:true, mode:0o700});
          fs.writeFileSync(auth + '/auth.json', JSON.stringify({token:process.env.VERCEL_TOKEN}), {mode:0o600});
          fs.mkdirSync('.vercel', {recursive:true});
          fs.writeFileSync('.vercel/project.json', JSON.stringify({projectId:process.env.VERCEL_PROJECT_ID,orgId:process.env.VERCEL_TEAM_ID}));
          JS
      - name: Verify release provenance before deployment
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          test "$current" = "$SOURCE_SHA"
          tag="v$(node -p "JSON.parse(require('fs').readFileSync('package.json')).version")"
          if git ls-remote --exit-code origin "refs/tags/$tag" > "$RUNNER_TEMP/release-tag"; then
            git fetch origin "refs/tags/$tag:refs/tags/$tag"
            test "$(git rev-parse "$tag^{commit}")" = "$SOURCE_SHA"
          else
            status=$?
            test "$status" = 2
          fi
      - name: Deploy reviewed source
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: npx --yes vercel@58.4.4 deploy --prod --yes --scope staix --global-config "$RUNNER_TEMP/vercel" --env "AX_RELEASE_SHA=$SOURCE_SHA" --build-env "AX_RELEASE_SHA=$SOURCE_SHA"
      - name: Publish installation assets
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          mkdir -p release-assets
          find verified -name ax-commons.mcpb -exec cp {} release-assets/ax-commons.mcpb \;
          find verified -path '*/dist/cli.mjs' -exec cp {} release-assets/ax-commons-cli.mjs \;
          find verified -name 'ax-commons-mcp-server-*.tgz' -exec cp {} release-assets/ \;
          (cd release-assets && sha256sum * > SHA256SUMS)
          tag="v$(node -p "JSON.parse(require('fs').readFileSync('package.json')).version")"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$SOURCE_SHA" --title "AX Commons $tag" --notes "Local MCP tools, approved contribution sharing, suppressed aggregates and Vercel deployment. Real-user checks remain deferred to the owner. Source: $SOURCE_SHA."
          fi
          gh release upload "$tag" release-assets/*
